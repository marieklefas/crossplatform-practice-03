<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron File Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Клефас Мария, группа ТРПО23-1</h1>

      <div class="buttons">
        <button id="listButton">Показать содержимое каталога</button>

        <button id="startWatchButton">Начать наблюдение</button>

        <button id="stopWatchButton">Остановить наблюдение</button>
      </div>

      <p id="status">Наблюдение выключено</p>

      <section>
        <h2>Содержимое каталога</h2>

        <ul id="fileList"></ul>
      </section>

      <section>
        <h2>События</h2>

        <ul id="events"></ul>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
